<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Skulptur</title>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/PLYLoader.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            z-index: 100;
            border: 1px solid #0f0;
            max-width: 300px;
            line-height: 1.5;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 11px;
            z-index: 100;
            border: 1px solid #0f0;
            max-width: 180px;
        }

        .control-item {
            margin: 8px 0;
        }

        input[type="color"] {
            width: 100%;
            height: 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        button:hover {
            background: #0d0;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="info">
        <div>📍 AR SKULPTUR</div>
        <div id="cameraStatus">📹 Kamera: Startar...</div>
        <div id="gpsStatus">📍 GPS: Initialiserar...</div>
        <div id="distanceStatus">📏 Avstånd: -</div>
        <div id="modelStatus">🎨 Modell: Laddar...</div>
    </div>

    <div id="controls">
        <div class="control-item">
            <label>Färg:</label>
            <input type="color" id="colorPicker" value="#00ff88">
        </div>
        <div class="control-item">
            <label>Skala:</label>
            <input type="range" id="scalePicker" min="0.5" max="3" value="1" step="0.1">
        </div>
        <button id="resetBtn">Återställ</button>
    </div>

    <script>
        // ========== DOM ELEMENTS ==========
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ========== THREE.JS ==========
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.01, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(canvas.width, canvas.height);
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(window.devicePixelRatio);

        // ========== KONSTANTER ==========
        const TARGET_LAT = 59.308028;
        const TARGET_LON = 18.084972;
        const MODEL_DISTANCE = 10; // 10 meter framåt
        const MODEL_HEIGHT = 10;   // 10 meter upp

        // ========== VARIABLER ==========
        let modelMesh = null;
        let userLat = null;
        let userLon = null;
        let userHeading = 0;
        let deviceAlpha = 0; // Roll
        let deviceBeta = 0;  // Pitch
        let deviceGamma = 0; // Yaw

        const settings = {
            color: 0x00ff88,
            scale: 1
        };

        // ========== KAMERA ==========
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                updateStatus('cameraStatus', '✓ Kamera aktiv');
                console.log('Kamera startat');
            } catch (err) {
                updateStatus('cameraStatus', '❌ Kamera error: ' + err.message);
                console.error('Kamera error:', err);
            }
        }

        // ========== LADDA PLY ==========
        function loadPLYModel() {
            const loader = new THREE.PLYLoader();

            loader.load('model.ply', geometry => {
                console.log('PLY laddat');

                geometry.center();
                geometry.computeVertexNormals();
                geometry.scale(0.01, 0.01, 0.01);

                const material = new THREE.PointsMaterial({
                    color: settings.color,
                    size: 0.1,
                    sizeAttenuation: true,
                    transparent: true
                });

                modelMesh = new THREE.Points(geometry, material);

                // Placera 10m framåt, 10m upp
                modelMesh.position.set(0, MODEL_HEIGHT, -MODEL_DISTANCE);

                scene.add(modelMesh);
                updateStatus('modelStatus', '✓ Modell laddat');
                console.log('Modell i scenen');
            });
        }

        // ========== GPS ==========
        function startGPS() {
            if (!navigator.geolocation) {
                updateStatus('gpsStatus', '❌ GPS ej tillgänglig');
                return;
            }

            navigator.geolocation.watchPosition(
                position => {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    userHeading = position.coords.heading || 0;

                    const distance = calculateDistance(userLat, userLon, TARGET_LAT, TARGET_LON);
                    const bearing = calculateBearing(userLat, userLon, TARGET_LAT, TARGET_LON);

                    updateStatus('gpsStatus', `✓ ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`);
                    updateStatus('distanceStatus', `${Math.round(distance)}m, Riktning: ${Math.round(bearing)}°`);
                },
                err => {
                    updateStatus('gpsStatus', '❌ GPS: ' + err.message);
                    console.error('GPS error:', err);
                }
            );
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // ========== DEVICE ORIENTATION ==========
        function startDeviceOrientation() {
            if (typeof DeviceOrientationEvent === 'undefined') {
                console.warn('Device Orientation ej stödd');
                return;
            }

            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+
                DeviceOrientationEvent.requestPermission()
                    .then(permission => {
                        if (permission === 'granted') {
                            window.addEventListener('deviceorientation', handleDeviceOrientation);
                        }
                    })
                    .catch(console.error);
            } else {
                // Android
                window.addEventListener('deviceorientation', handleDeviceOrientation);
            }
        }

        function handleDeviceOrientation(event) {
            deviceAlpha = event.alpha || 0; // Z
            deviceBeta = event.beta || 0;   // X
            deviceGamma = event.gamma || 0; // Y
        }

        // ========== RENDER LOOP ==========
        function animate() {
            requestAnimationFrame(animate);

            // Rotera kameran baserat på enhetens orientering
            if (deviceBeta !== null) {
                camera.rotation.order = 'YXZ';
                camera.rotation.y = -deviceGamma * Math.PI / 180;
                camera.rotation.x = -deviceBeta * Math.PI / 180;
            }

            // Rotera modellen baserat på heading
            if (modelMesh && userHeading !== null) {
                modelMesh.rotation.y = (userHeading * Math.PI / 180) + Math.PI;
            }

            renderer.render(scene, camera);
        }

        // ========== KONTROLLER ==========
        document.getElementById('colorPicker').addEventListener('change', e => {
            settings.color = parseInt(e.target.value.replace('#', '0x'));
            if (modelMesh) {
                modelMesh.material.color.setHex(settings.color);
            }
        });

        document.getElementById('scalePicker').addEventListener('input', e => {
            settings.scale = parseFloat(e.target.value);
            if (modelMesh) {
                modelMesh.scale.set(settings.scale, settings.scale, settings.scale);
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('colorPicker').value = '#00ff88';
            document.getElementById('scalePicker').value = '1';
            settings.color = 0x00ff88;
            settings.scale = 1;
            if (modelMesh) {
                modelMesh.material.color.setHex(settings.color);
                modelMesh.scale.set(1, 1, 1);
            }
        });

        // ========== UTILITY ==========
        function updateStatus(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        // ========== WINDOW RESIZE ==========
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            canvas.width = width;
            canvas.height = height;
        });

        // ========== INIT ==========
        console.log('Initialiserar...');
        startCamera();
        startGPS();
        startDeviceOrientation();
        loadPLYModel();
        animate();
    </script>
</body>
</html>
