<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR WebXR Geo Skulptur</title>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/PLYLoader.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100%;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 10px;
            z-index: 100;
            border: 1px solid #0f0;
            max-width: 280px;
            line-height: 1.4;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            z-index: 100;
            border: 1px solid #0f0;
            max-width: 150px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
        }

        button:hover {
            background: #0d0;
        }

        .slider-group {
            margin: 8px 0;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        input[type="color"] {
            width: 100%;
            height: 20px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
        }

        #startARBtn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 12px 20px;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            z-index: 200;
        }

        #startARBtn:hover {
            background: #0d0;
        }

        #startARBtn:disabled {
            background: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <button id="startARBtn">🚀 Starta AR</button>

    <div id="info">
        <div>📍 AR WebXR GEO</div>
        <div id="arStatus">AR: Initialiserar...</div>
        <div id="gpsStatus">GPS: -</div>
        <div id="distance">Avstånd: -</div>
        <div id="modelStatus">Modell: Laddar...</div>
    </div>

    <div id="controls">
        <div>Färg:</div>
        <input type="color" id="colorPicker" value="#00ff88">

        <div style="margin-top: 8px;">Skala:</div>
        <input type="range" id="scalePicker" min="0.5" max="5" value="1" step="0.1">

        <button id="resetBtn">Återställ</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const startARBtn = document.getElementById('startARBtn');

        // ========== THREE.JS SETUP ==========
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.xr.setFramebufferScaleFactor(1.0);

        // ========== KONSTANTER ==========
        const TARGET_LAT = 59.308028;
        const TARGET_LON = 18.084972;
        const MODEL_HEIGHT = 10; // 10 meter upp
        const MODEL_DISTANCE = 10; // 10 meter framåt

        // ========== VARIABLER ==========
        let xrSession = null;
        let modelMesh = null;
        let userLat = null;
        let userLon = null;
        let userHeading = 0;

        const settings = {
            color: 0x00ff88,
            scale: 1
        };

        // ========== LADDA PLY-MODELL ==========
        function loadPLYModel() {
            const loader = new THREE.PLYLoader();

            loader.load('model.ply', geometry => {
                console.log('PLY laddat:', geometry);

                geometry.center();
                geometry.computeVertexNormals();
                geometry.scale(0.01, 0.01, 0.01); // Skala ner PLY

                const material = new THREE.PointsMaterial({
                    color: settings.color,
                    size: 0.5,
                    sizeAttenuation: true
                });

                modelMesh = new THREE.Points(geometry, material);
                modelMesh.position.set(0, MODEL_HEIGHT, -MODEL_DISTANCE);
                scene.add(modelMesh);

                updateInfo('modelStatus', '✓ Modell laddat');
                startARBtn.disabled = false;
            });
        }

        // ========== GPS ==========
        function startGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    userHeading = position.coords.heading || 0;

                    const distance = calculateDistance(userLat, userLon, TARGET_LAT, TARGET_LON);
                    const bearing = calculateBearing(userLat, userLon, TARGET_LAT, TARGET_LON);

                    updateInfo('gpsStatus', `GPS: ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`);
                    updateInfo('distance', `Avstånd: ${Math.round(distance)}m, Riktning: ${Math.round(bearing)}°`);
                });
            } else {
                updateInfo('gpsStatus', '❌ GPS ej tillgänglig');
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // ========== WebXR AR ==========
        async function startAR() {
            try {
                const sessionInit = {
                    requiredFeatures: ['hit-test', 'dom-overlay'],
                    optionalFeatures: ['dom-overlay-for-handheld-ar'],
                    domOverlay: { root: document.body }
                };

                xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
                console.log('WebXR session started');

                const glLayer = new XRWebGLLayer(xrSession, renderer.getContext('webgl'));
                xrSession.updateRenderState({ baseLayer: glLayer });

                const referenceSpace = await xrSession.requestReferenceSpace('local');

                xrSession.requestAnimationFrame(onXRFrame.bind(null, referenceSpace));

                updateInfo('arStatus', '✅ AR AKTIVT');
                startARBtn.disabled = true;
                startARBtn.textContent = '🎯 AR Körs';

            } catch (err) {
                updateInfo('arStatus', '❌ WebXR error: ' + err.message);
                console.error('WebXR error:', err);
            }
        }

        function onXRFrame(referenceSpace, time, frame) {
            const session = frame.session;

            // Uppdatera camera
            const pose = frame.getViewerPose(referenceSpace);
            if (pose) {
                renderer.render(scene, camera);
            }

            // Rotera modellen baserat på heading
            if (modelMesh && userHeading !== null) {
                modelMesh.rotation.y = userHeading * Math.PI / 180;
            }

            session.requestAnimationFrame(onXRFrame.bind(null, referenceSpace));
        }

        // ========== KONTROLLER ==========
        document.getElementById('colorPicker').addEventListener('change', e => {
            settings.color = parseInt(e.target.value.replace('#', '0x'));
            if (modelMesh) modelMesh.material.color.setHex(settings.color);
        });

        document.getElementById('scalePicker').addEventListener('input', e => {
            settings.scale = parseFloat(e.target.value);
            if (modelMesh) modelMesh.scale.set(settings.scale, settings.scale, settings.scale);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('colorPicker').value = '#00ff88';
            document.getElementById('scalePicker').value = '1';
            settings.color = 0x00ff88;
            settings.scale = 1;
            if (modelMesh) {
                modelMesh.material.color.setHex(settings.color);
                modelMesh.scale.set(1, 1, 1);
            }
        });

        startARBtn.addEventListener('click', startAR);

        // ========== UTILITY ==========
        function updateInfo(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        // ========== INIT ==========
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Starta
        loadPLYModel();
        startGPS();

        // Kontrollera WebXR stöd
        if (!navigator.xr) {
            updateInfo('arStatus', '❌ WebXR ej stödd');
            startARBtn.disabled = true;
        } else {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (!supported) {
                    updateInfo('arStatus', '❌ AR inte stödd');
                    startARBtn.disabled = true;
                }
            });
        }
    </script>
</body>
</html>
